[desktop]
http_host=0.0.0.0
http_port=8888
secret_key=${HUE_SECRET_KEY}

[[auth]]
backend=desktop.auth.backend.AllowFirstUserDjangoBackend
force_username_lowercase=false

[[database]]
engine=postgresql_psycopg2
host=postgres
port=5432
user=${HUE_DB_USER}
password=${HUE_DB_PASSWORD}
name=${HUE_DB_NAME}

[beeswax]
hive_server_host=hiveserver2
hive_server_port=10000

[notebook]
show_notebooks=true

[[interpreters]]

[[[hive]]]
name=Hive
interface=hiveserver2

[hadoop]

[[hdfs_clusters]]

[[[default]]]
is_enabled=false